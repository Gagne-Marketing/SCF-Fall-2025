<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
  <link rel="stylesheet" href="./styles/styles.css" />
</head>
<body>
  <div id="Container">
    <!-- Header -->
    <header class="site-header">
      <h1>Quiz Game</h1>
    </header>

    <!-- Landing Page (start menu) -->
    <div class="page" id="landing-page">
      <h2>Welcome to the Tech Quiz!</h2>

      <button id="btn-start">Start the Quiz</button>

      <!-- How many questions -->
      <div class="controls">
        <label for="question-count">How many questions?</label>
        <div class="qc-row">
          <select id="question-count">
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>
      </div>

      <!-- Difficulty selection -->
      <div class="controls">
        <strong>Difficulty</strong>

        <!-- Single difficulty (default) -->
        <div class="qc-row">
          <label class="qc-inline">
            <input type="radio" name="diffMode" id="mode-single" value="single" checked>
            Single
          </label>
          <select id="difficultySelect" aria-label="Difficulty">
            <option value="easy">easy</option>
            <option value="medium" selected>medium</option>
            <option value="hard">hard</option>
          </select>
        </div>

        <!-- Mixed difficulties -->
        <div class="qc-row">
          <label class="qc-inline">
            <input type="radio" name="diffMode" id="mode-mixed" value="mixed">
            Mix difficulties
          </label>
        </div>

        <div id="mixedRow" class="qc-pills qc-disabled">
          <label class="qc-pill"><input type="checkbox" id="mix-easy"> easy</label>
          <label class="qc-pill"><input type="checkbox" id="mix-medium" checked> medium</label>
          <label class="qc-pill"><input type="checkbox" id="mix-hard"> hard</label>
        </div>

        <div class="help">Tip: Mixed mode splits your chosen total across the checked difficulties.</div>
      </div>

      <!-- Custom Question Form -->
      <form id="userQForm">
        <h2>Add Your Custom Question</h2>

        <div class="uq-field">
          <label for="uq-text">Question</label>
          <input id="uq-text" type="text" placeholder="Type your question…" required autocomplete="off">
        </div>

        <div class="uq-field">
          <label for="uq-a0">Answer 1</label>
          <input id="uq-a0" type="text" placeholder="Answer 1" required autocomplete="off">
        </div>

        <div class="uq-field">
          <label for="uq-a1">Answer 2</label>
          <input id="uq-a1" type="text" placeholder="Answer 2" required autocomplete="off">
        </div>

        <div class="uq-field">
          <label for="uq-a2">Answer 3</label>
          <input id="uq-a2" type="text" placeholder="Answer 3" required autocomplete="off">
        </div>

        <div class="uq-field">
          <label for="uq-a3">Answer 4</label>
          <input id="uq-a3" type="text" placeholder="Answer 4" required autocomplete="off">
        </div>

        <div class="uq-row">
          <div class="uq-field">
            <label for="uq-correct">Which answer is correct?</label>
            <select id="uq-correct">
              <option value="0">Answer 1</option>
              <option value="1">Answer 2</option>
              <option value="2">Answer 3</option>
              <option value="3">Answer 4</option>
            </select>
          </div>

          <div class="uq-field">
            <label for="uq-diff">Difficulty</label>
            <select id="uq-diff">
              <option value="easy">easy</option>
              <option value="medium" selected>medium</option>
              <option value="hard">hard</option>
            </select>
          </div>
        </div>

        <div class="uq-actions">
          <button type="submit">Add Question</button>
          <button type="button" class="btn-secondary" id="uq-reset">Reset</button>
        </div>

        <div id="uq-msg" aria-live="polite"></div>
      </form>
    </div><!-- ✅ end #landing-page -->

    <!-- Quiz Page -->
    <div class="page is-hidden" id="quiz-page">
      <h2>This is the Quiz!</h2>

      <!-- Win Modal -->
      <div class="modal" id="win-modal" aria-hidden="true">
        <div class="modal-card">
          <p id="win-message">🎉 Congratulations!<br>You completed the quiz!</p>
          <p id="final-score">Final Points: 0 points</p>
          <button id="btn-win-end">End</button>
        </div>
      </div>
      

      <!-- Lose Modal -->
      <div class="modal" id="loose-modal" aria-hidden="true">
        <div class="modal-card">
          <p>Nope, try again?</p>
          <div class="modal-actions">
            <button id="btn-try-again">Try Again</button>
            <button id="btn-loose-end">End</button>
          </div>
        </div>
      </div>

      <button id="btn-check-answer">Check Answer</button>

      <section id="quiz-question"></section>
      <div id="quiz-progress" class="quiz-progress"></div>
      <section id="quiz-message-box"></section>
      <section id="point_value">Score: 0</section>
    </div>
  

  <script src="./scripts/main.js" type="text/javascript"></script>
</body>
</html>
