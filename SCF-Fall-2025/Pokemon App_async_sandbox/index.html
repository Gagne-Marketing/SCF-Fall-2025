<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokémon Info App</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Optional: your small UX polish -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">Pokémon Info App</h1>

    <!-- Toolbar: Search + Sort -->
    <div class="position-sticky top-0 bg-white z-3 border-bottom py-2 mb-3">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-8">
          <div class="input-group">
            <input
              type="search"
              id="searchInput"
              class="form-control"
              placeholder="Search Pokémon by name or ID..."
              aria-label="Search Pokémon"
              list="pokemonNames"
            />
            <button class="btn btn-primary" id="searchBtn" type="button">Search</button>
          </div>
          <!-- Autocomplete list populated by JS -->
          <datalist id="pokemonNames"></datalist>
        </div>
        <div class="col-12 col-md-4">
          <label for="sortSelect" class="form-label mb-1">Sort</label>
          <select id="sortSelect" class="form-select" aria-label="Sort Pokémon">
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Content layout: Left sidebar + Right list -->
    <div class="row g-4">
      <!-- Left: Filters -->
      <aside class="col-12 col-lg-4">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <strong>Filter Pokémon</strong>
            <button class="btn btn-sm btn-outline-secondary" id="clearFilters" type="button">Clear all</button>
          </div>

          <!-- Filters body (cleaned and ordered) -->
          <div class="card-body">
            <!-- Live result count and indexing progress -->
            <div class="mb-3">
              <div class="small text-muted" id="resultCount" aria-live="polite">Loading Pokédex…</div>
              <div class="progress mt-2" role="progressbar" aria-label="Indexing progress" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar" id="indexProgress" style="width: 0%"></div>
              </div>
              <div class="small text-muted mt-1" id="indexNote">Preparing filters…</div>
            </div>

            <!-- Quick Picks -->
            <div class="mb-3">
              <div class="form-label mb-2">Quick Picks</div>
              <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-outline-primary btn-sm" data-preset="fast" type="button">⚡ Fast Runners</button>
                <button class="btn btn-outline-primary btn-sm" data-preset="tough" type="button">🛡️ Hard to Knock Out</button>
                <button class="btn btn-outline-primary btn-sm" data-preset="strong" type="button">💥 Big Hitters</button>
                <button class="btn btn-outline-primary btn-sm" data-preset="balanced" type="button">🔄 Balanced Team</button>
                <button class="btn btn-outline-primary btn-sm" data-preset="cute" type="button">🧸 Small & Cute</button>
              </div>
            </div>

            <!-- Type (with icons) -->
            <div class="mb-3">
              <label for="typeChips" class="form-label">🔮 Type</label>
              <div id="typeChips" class="d-flex flex-wrap gap-2" role="group" aria-label="Filter by type"></div>
              <div class="form-text">Pick any types you like.</div>
            </div>

            <!-- Size (single heading; Height + Weight inside) -->
            <div class="mb-3" id="sizeSection">
              <div class="form-label">📏 Size</div>
              <div class="row g-2">
                <div class="col-6">
                  <fieldset class="border rounded p-2">
                    <legend class="fs-6 fw-semibold mb-2 px-2">Height</legend>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="heightBucket" id="hAny" value="any" checked>
                      <label class="form-check-label" for="hAny">Any</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="heightBucket" id="hSmall" value="small">
                      <label class="form-check-label" for="hSmall">Small (≤ 1.0 m)</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="heightBucket" id="hMedium" value="medium">
                      <label class="form-check-label" for="hMedium">Medium (1.01–2.0 m)</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="heightBucket" id="hTall" value="tall">
                      <label class="form-check-label" for="hTall">Tall (≥ 2.01 m)</label>
                    </div>
                  </fieldset>
                </div>
                <div class="col-6">
                  <fieldset class="border rounded p-2">
                    <legend class="fs-6 fw-semibold mb-2 px-2">Weight</legend>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="weightBucket" id="wAny" value="any" checked>
                      <label class="form-check-label" for="wAny">Any</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="weightBucket" id="wLight" value="light">
                      <label class="form-check-label" for="wLight">Light (≤ 20 kg)</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="weightBucket" id="wMedium" value="medium">
                      <label class="form-check-label" for="wMedium">Medium (20.1–100 kg)</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="weightBucket" id="wHeavy" value="heavy">
                      <label class="form-check-label" for="wHeavy">Heavy (≥ 100.1 kg)</label>
                    </div>
                  </fieldset>
                </div>
              </div>
              <div class="form-text">Approximate size—no need to be exact.</div>
            </div>

            <!-- Simple selects (kid-friendly) -->
            <div class="mb-3">
              <label for="speedSelect" class="form-label">⚡ How fast?</label>
              <select id="speedSelect" class="form-select">
                <option value="any">Any</option>
                <option value="fast">Fast</option>
                <option value="veryfast">Very Fast</option>
              </select>
              <div class="form-text">Fast ones usually move first.</div>
            </div>

            <div class="mb-3">
              <label for="strengthSelect" class="form-label">💪 Attack power</label>
              <select id="strengthSelect" class="form-select">
                <option value="any">Any</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
              <div class="form-text">How hard hits land.</div>
            </div>

            <div class="mb-3">
              <label for="toughnessSelect" class="form-label">🛡️ How tough?</label>
              <select id="toughnessSelect" class="form-select">
                <option value="any">Any</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
              </select>
              <div class="form-text">Harder to knock out.</div>
            </div>

            <!-- Actions -->
            <div class="d-grid gap-2">
              <button class="btn btn-primary" id="applyFilters" type="button">Apply filters</button>
              <button class="btn btn-outline-secondary" id="resetSection" type="button">Reset section</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- Right: List + pagination -->
      <main class="col-12 col-lg-8">
        <h2 class="mb-3">Pokémon List</h2>
        <ul id="pokemon-list" class="list-group mb-3"></ul>

        <!-- Results info -->
        <p id="results-info" class="text-center text-muted"></p>

        <!-- Pagination -->
        <nav aria-label="Pokémon list pages">
          <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div
    class="modal fade"
    id="pokemonModal"
    tabindex="-1"
    aria-labelledby="pokemonModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="pokemonModalLabel">Pokémon Details</h5>
          <div class="d-flex gap-2 me-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="modalPrev" aria-label="Previous">◀</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" id="modalNext" aria-label="Next">▶</button>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="pokemon-details"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- App script -->
  <script src="script.js"></script>
</body>
</html>
